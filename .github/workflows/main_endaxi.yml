# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - endaxi

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install and build
        env:
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/endaxi_ci
          BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
          NUXT_PUBLIC_APP_URL: https://ci.endaxi.invalid
          TRUST_AZURE_PROXY: "1"
          UPSTASH_REDIS_REST_URL: https://ci-upstash.invalid
          UPSTASH_REDIS_REST_TOKEN: ci-only-token
          INNGEST_EVENT_KEY: ci-only-event-key
          INNGEST_SIGNING_KEY: signkey-test-ci-only-signing-key
          GROQ_API_KEY: ci-only-groq-key
          RESEND_API_KEY: re_ci_only
          EMAIL_FROM: Endaxi <noreply@endaxi.invalid>
          R2_ACCOUNT_ID: ci-only-account
          R2_ACCESS_KEY_ID: ci-only-access-key
          R2_SECRET_ACCESS_KEY: ci-only-secret-key
          R2_BUCKET: ci-only-bucket
        run: |
          npm install
          npm run build --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_B6049202FE534A1D8A03C495F3CAAF14 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_974F11F8CB974DB98AE316F68FD97F1E }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_326BA21068B040EE85B73214B5EE9D5B }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'endaxi'
          slot-name: 'Production'
          package: .
