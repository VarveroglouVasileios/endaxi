name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: endaxi
          POSTGRES_PASSWORD: endaxi
          POSTGRES_DB: endaxi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U endaxi -d endaxi_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      TZ: Europe/Athens
      TEST_DATABASE_URL: postgresql://endaxi:endaxi@127.0.0.1:5432/endaxi_test
      DATABASE_URL: postgresql://endaxi:endaxi@127.0.0.1:5432/endaxi_ci
      BETTER_AUTH_SECRET: ci-only-secret-with-at-least-32-characters
      NUXT_PUBLIC_APP_URL: https://ci.endaxi.invalid
      TRUST_AZURE_PROXY: "1"
      UPSTASH_REDIS_REST_URL: https://ci-upstash.invalid
      UPSTASH_REDIS_REST_TOKEN: ci-only-token
      INNGEST_EVENT_KEY: ci-only-event-key
      INNGEST_SIGNING_KEY: signkey-test-ci-only-signing-key
      GROQ_API_KEY: ci-only-groq-key
      RESEND_API_KEY: re_ci_only
      EMAIL_FROM: Endaxi <noreply@endaxi.invalid>
      R2_ACCOUNT_ID: ci-only-account
      R2_ACCESS_KEY_ID: ci-only-access-key
      R2_SECRET_ACCESS_KEY: ci-only-secret-key
      R2_BUCKET: ci-only-bucket

    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level moderate
      - run: pnpm verify
      - run: pnpm build
