# Τοπική Postgres για ανάπτυξη & integration tests.
#
#   docker compose up -d
#   pnpm test
#
# Η παραγωγή θα τρέξει σε managed Postgres (Neon/Supabase, EU region).
# Αυτό είναι μόνο για τοπική δουλειά.

services:
  db:
    image: postgres:18-alpine
    container_name: endaxi-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: endaxi
      POSTGRES_PASSWORD: endaxi
      POSTGRES_DB: endaxi
      # Ίδιο locale με την παραγωγή — αποφεύγει εκπλήξεις σε ταξινομήσεις
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '54329:5432'
    volumes:
      - endaxi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U endaxi -d endaxi']
      interval: 5s
      timeout: 3s
      retries: 10

  db-test:
    image: postgres:18-alpine
    container_name: endaxi-test-db
    environment:
      POSTGRES_USER: endaxi
      POSTGRES_PASSWORD: endaxi
      POSTGRES_DB: endaxi_test
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C.UTF-8'
    ports:
      - '54330:5432'
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U endaxi -d endaxi_test']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  endaxi-pgdata:
